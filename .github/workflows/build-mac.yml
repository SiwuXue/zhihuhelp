name: CI-Mac

on:
  workflow_dispatch:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: ['22.x'] # Electron 43 对应 Node.js 22

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 获取package.json中的版本号, 方便后续处理
      - name: Read package.json
        id: get-version-from-package-json
        run: |
          echo "packageVersion=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Show version number
        run: echo "current version is ${{ steps.get-version-from-package-json.outputs.packageVersion }}"
      - name: Install frontend dependencies
        run: cd ./client && npm install && cd ..
      - name: Install backend dependencies
        run: npm install
      # Sharp 0.33+ 支持从 npm 预编译二进制直接安装，无需单独重建
      - name: Build backend (tsc)
        run: npm run build-without-sourcemap
      - name: Build frontend (Vite)
        run: npm run buildgui
      - name: Build macOS installer
        run: npx electron-builder --mac
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        id: create_release
        uses: monkeyWie/create-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: mac-v${{ steps.get-version-from-package-json.outputs.packageVersion }}
          release_name: macOS v${{ steps.get-version-from-package-json.outputs.packageVersion }}
          draft: true
          prerelease: false
      - name: Upload Release macOS 7z
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/知乎助手-${{ steps.get-version-from-package-json.outputs.packageVersion }}-mac.7z
          asset_name: zhihuhelp-mac-v${{ steps.get-version-from-package-json.outputs.packageVersion }}.7z
          asset_content_type: application/x-7z-compressed
