name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v2.7.1)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node-version: ['22']

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install pnpm (from packageManager field)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm run build-without-sourcemap

      - name: Build frontend
        run: pnpm run buildgui

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win --publish never
        env:
          CI: true

      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        # 同时构建 Apple Silicon(arm64) 和 Intel(x64) 两个架构, 兼容两种 Mac
        run: pnpm exec electron-builder --mac --x64 --arm64 --publish never
        env:
          CI: true
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List release outputs
        shell: bash
        run: ls -lh release/

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zhihuhelp-windows
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error
          compression-level: 0

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: zhihuhelp-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create Release
        run: python3 scripts/publish-release.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_NAME: 知乎助手 v${{ steps.version.outputs.version }}
          RELEASE_BODY: |
            ## 知乎助手 v${{ steps.version.outputs.version }}

            感谢使用知乎助手！

            ### 功能特性
            - 导出知乎内容为 EPUB、PDF、Markdown、HTML 格式
            - 支持Answers、Articles、Pins、Collections、Topics、Columns
            - 图片自动下载嵌入
            - LaTeX 公式正确渲染

            ### 下载
            - **Windows**: zhihuhelp-windows/*.exe (NSIS 安装包), zhihuhelp-windows/*.msi (MSI 安装包)
            - **macOS**: zhihuhelp-macos/*.dmg (磁盘镜像), zhihuhelp-macos/*.zip (压缩包, 内含 .app)
