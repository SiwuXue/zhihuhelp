name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        node-version: ['22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm install

      - name: Install backend dependencies
        run: npm install

      - name: Build backend
        run: npm run build-without-sourcemap

      - name: Build frontend
        run: npm run buildgui

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: zhihuhelp-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: zhihuhelp-macos
          path: release/*.7z
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 知乎助手 v${{ steps.version.outputs.version }}
          body: |
            ## 知乎助手 v${{ steps.version.outputs.version }}

            感谢使用知乎助手！

            ### 功能特性
            - 导出知乎内容为 EPUB、PDF、Markdown、HTML 格式
            - 支持Answers、Articles、Pins、Collections、Topics、Columns
            - 图片自动下载嵌入
            - LaTeX 公式正确渲染

            ### 下载
            - **Windows**: zhihuhelp-windows/*.exe
            - **macOS**: zhihuhelp-macos/*.7z
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
