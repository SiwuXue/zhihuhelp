name: CI-Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: ['22.x'] # Electron 43 对应 Node.js 22

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 获取package.json中的版本号, 方便后续处理
      - name: Read package.json
        id: get-version-from-package-json
        run: |
          echo "packageVersion=$(node -p "require('./package.json').version")" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Show version number
        run: echo "current version is ${{ steps.get-version-from-package-json.outputs.packageVersion }}"
      - name: Install frontend dependencies
        run: cd ./client; npm install; cd ..
      - name: Install backend dependencies
        run: npm install
      - name: Build backend (tsc)
        run: npm run build-without-sourcemap
      - name: Build frontend (Vite)
        run: npm run buildgui
      - name: Build Windows installer
        run: npx electron-builder --win
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        id: create_release
        uses: monkeyWie/create-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: win-v${{ steps.get-version-from-package-json.outputs.packageVersion }}
          release_name: Windows v${{ steps.get-version-from-package-json.outputs.packageVersion }}
          draft: true
          prerelease: false
      - name: Upload Release Windows Installer (NSIS)
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/知乎助手 Setup ${{ steps.get-version-from-package-json.outputs.packageVersion }}.exe
          asset_name: zhihuhelp-win64-v${{ steps.get-version-from-package-json.outputs.packageVersion }}.exe
          asset_content_type: application/vnd.microsoft.portable-executable
